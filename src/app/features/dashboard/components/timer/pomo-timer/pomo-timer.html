<!-- MAIN TIMER CARD -->
<div
  class="bg-[#121620] border border-slate-800/80 rounded-3xl p-8 flex flex-col items-center justify-between relative shadow-2xl"
>
  <!-- Timer Mode Pills -->
  <div
    class="flex items-center gap-2 bg-[#0b0e14]/60 p-1.5 rounded-full border border-slate-800/50 mb-8"
  >
    <button
      class="px-6 py-2 rounded-full text-sm font-medium text-white bg-gradient-to-r from-indigo-600 to-blue-600 shadow-lg shadow-indigo-500/25"
    >
      Pomodoro
    </button>
    <button
      class="px-6 py-2 rounded-full text-sm font-medium text-slate-400 hover:text-white transition-all"
    >
      Short Break
    </button>
    <button
      class="px-6 py-2 rounded-full text-sm font-medium text-slate-400 hover:text-white transition-all"
    >
      Long Break
    </button>
  </div>

  <!-- Circular Timer Display -->
  <div class="relative w-80 h-80 flex items-center justify-center my-4">
    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
      <!-- Background Circle -->
      <circle cx="50" cy="50" r="44" stroke="#1b202e" stroke-width="3" fill="transparent" />
      <!-- Active Progress Arc -->
      <circle
        cx="50"
        cy="50"
        r="44"
        stroke="url(#blue-gradient)"
        stroke-width="3.5"
        fill="transparent"
        stroke-linecap="round"
        stroke-dasharray="276"
        stroke-dashoffset="60"
      />
      <defs>
        <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4f46e5" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
      </defs>
    </svg>

    <!-- Floating Progress Knob -->
    <div
      class="absolute top-[28px] right-[48px] w-5 h-5 bg-indigo-400 rounded-full border-2 border-indigo-200 shadow-[0_0_12px_rgba(99,102,241,0.8)]"
    ></div>

    <!-- Center Content -->
    <div class="absolute flex flex-col items-center text-center px-4">
      <span class="text-2xl mb-1">🍅</span>
      <span class="text-xs font-medium text-slate-400 tracking-wider mb-1">Focus Time</span>
      <h1 class="text-6xl font-semibold tracking-tight text-white mb-4">25:00</h1>

      <button
        class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-800/40 border border-slate-700/50 text-xs text-slate-400 hover:text-white hover:border-slate-600 transition-all"
      >
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
          ></path>
        </svg>
        <span>Tap to add task</span>
      </button>
    </div>
  </div>

  <!-- Timer Controls -->
  <div class="flex items-center justify-center gap-6 mt-8 w-full max-w-md">
    <!-- Reset -->
    <div class="flex flex-col items-center gap-2">
      <button
        class="w-12 h-12 rounded-full bg-[#181d2a] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          ></path>
        </svg>
      </button>
      <span class="text-[11px] text-slate-400 font-medium">Reset</span>
    </div>

    <!-- Previous -->
    <div class="flex flex-col items-center gap-2">
      <button
        class="w-12 h-12 rounded-full bg-[#181d2a] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
          ></path>
        </svg>
      </button>
      <span class="text-[11px] text-slate-400 font-medium">Previous</span>
    </div>

    <!-- Start (Primary CTA) -->
    <div class="flex flex-col items-center gap-2 -mt-2">
      <button
        class="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30 hover:scale-105 transition-all"
      >
        <svg class="w-6 h-6 fill-current ml-0.5" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
      <span class="text-[11px] text-slate-300 font-medium">Start</span>
    </div>

    <!-- Skip -->
    <div class="flex flex-col items-center gap-2">
      <button
        class="w-12 h-12 rounded-full bg-[#181d2a] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 5l7 7-7 7M5 5l7 7-7 7"
          ></path>
        </svg>
      </button>
      <span class="text-[11px] text-slate-400 font-medium">Skip</span>
    </div>

    <!-- Stop -->
    <div class="flex flex-col items-center gap-2">
      <button
        class="w-12 h-12 rounded-full bg-[#181d2a] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 6h12v12H6z" />
        </svg>
      </button>
      <span class="text-[11px] text-slate-400 font-medium">Stop</span>
    </div>
  </div>
</div>
