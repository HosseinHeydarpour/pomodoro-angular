<div class="bg-[#121620] border border-slate-800/80 rounded-3xl p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-base font-semibold text-white">Session Summary</h2>
    <button
      class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white bg-slate-800/40 px-3 py-1.5 rounded-lg border border-slate-700/50"
    >
      <span>Today</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        ></path>
      </svg>
    </button>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <!-- Stat 1 -->
    <div class="flex items-center gap-3">
      <div
        class="w-11 h-11 rounded-full bg-indigo-950/60 border border-indigo-800/40 flex items-center justify-center text-indigo-400 shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
      <div>
        <p class="text-[11px] text-slate-400">Focus Time</p>
        <p class="text-lg font-bold text-white">
          {{ taskService.stats().todaysFocusedHoursDisplay }}
        </p>
      </div>
    </div>

    <!-- Stat 2 -->
    <div class="flex items-center gap-3">
      <div
        class="w-11 h-11 rounded-full bg-emerald-950/60 border border-emerald-800/40 flex items-center justify-center text-emerald-400 shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
      <div>
        <p class="text-[11px] text-slate-400">Completed</p>
        <p class="text-lg font-bold text-white">{{ taskService.stats().todaysPomodoros }}</p>
      </div>
    </div>

    <!-- Stat 3 -->
    <div class="flex items-center gap-3">
      <div
        class="w-11 h-11 rounded-full bg-amber-950/60 border border-amber-800/40 flex items-center justify-center text-amber-400 shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
          ></path>
        </svg>
      </div>
      <div>
        <p class="text-[11px] text-slate-400">Pomodoros</p>
        <p class="text-lg font-bold text-white">{{ taskService.stats().uncompletedPomodoros }}</p>
      </div>
    </div>

    <!-- Stat 4 -->
    <div class="flex items-center gap-3">
      <div
        class="w-11 h-11 rounded-full bg-blue-950/60 border border-blue-800/40 flex items-center justify-center text-blue-400 shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
      </div>
      <div>
        <p class="text-[11px] text-slate-400">Long Breaks</p>
        <p class="text-lg font-bold text-white">2</p>
      </div>
    </div>
  </div>
</div>
