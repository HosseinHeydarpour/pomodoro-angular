<div class="bg-surface border border-border/80 rounded-3xl p-4 sm:p-6 shadow-card">
  <div class="flex items-center justify-between mb-6 gap-3">
    <h2 class="text-base font-semibold text-text">Session Summary</h2>
    <button
      class="flex items-center gap-1.5 text-xs text-text-muted hover:text-text bg-surface-2 px-3 py-1.5 rounded-lg border border-border/50 shrink-0"
    >
      <span>Today</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        ></path>
      </svg>
    </button>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <!-- Stat 1 -->
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-primary shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] text-text-muted">Focus Time</p>
        <p class="text-lg font-bold text-text truncate">
          {{ taskService.stats().todaysFocusedHoursDisplay }}
        </p>
      </div>
    </div>

    <!-- Stat 2 -->
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 rounded-full bg-success/10 border border-success/20 flex items-center justify-center text-success shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] text-text-muted">Completed</p>
        <p class="text-lg font-bold text-text">{{ taskService.stats().todaysPomodoros }}</p>
      </div>
    </div>

    <!-- Stat 3 -->
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 rounded-full bg-warning/10 border border-warning/20 flex items-center justify-center text-warning shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
          ></path>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] text-text-muted">Pomodoros</p>
        <p class="text-lg font-bold text-text">{{ taskService.stats().uncompletedPomodoros }}</p>
      </div>
    </div>

    <!-- Stat 4 -->
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-11 h-11 rounded-full bg-info/10 border border-info/20 flex items-center justify-center text-info shrink-0"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          ></path>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-[11px] text-text-muted">Long Breaks</p>
        <p class="text-lg font-bold text-text">2</p>
      </div>
    </div>
  </div>
</div>
