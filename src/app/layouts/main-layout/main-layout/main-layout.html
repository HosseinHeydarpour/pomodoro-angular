<div class="flex min-h-screen bg-background">
  <!-- Mobile Overlay -->
  <div
    class="fixed inset-0 bg-black/50 z-40 lg:hidden transition-opacity duration-300"
    [class.opacity-0]="!isSidebarOpen()"
    [class.pointer-events-none]="!isSidebarOpen()"
    (click)="toggleSidebar()"
  ></div>

  <!-- Sidebar Container -->
  <div
    class="w-64 fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 ease-in-out lg:transform-none"
    [class.-translate-x-full]="!isSidebarOpen()"
  >
    <app-sidebar></app-sidebar>
  </div>

  <!-- Main Content View -->
  <div class="flex-1 flex flex-col min-w-0 lg:ml-64">
    <app-header></app-header>
    <main class="flex-1 px-4 sm:px-6 pb-4 sm:pb-6 overflow-y-auto overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>
    <footer class="mt-auto pt-4 pb-4 px-4 sm:px-6">
      <app-footer></app-footer>
    </footer>
  </div>
</div>
