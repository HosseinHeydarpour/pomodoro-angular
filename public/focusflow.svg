<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D6AFE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="primaryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background (Rounded 2xl equivalent) -->
  <rect width="512" height="512" rx="96" fill="#111827" stroke="#23314A" stroke-width="8" />

  <!-- Background Track Ring -->
  <path 
    d="M 256 128 A 128 128 0 1 1 128 256" 
    fill="none" 
    stroke="#172033" 
    stroke-width="32" 
    stroke-linecap="round" 
  />

  <!-- Active Glowing Pomodoro Ring (Arc) -->
  <path 
    d="M 256 128 A 128 128 0 1 1 156 335" 
    fill="none" 
    stroke="url(#primaryGradient)" 
    stroke-width="32" 
    stroke-linecap="round" 
    filter="url(#primaryGlow)"
  />

  <!-- Stylized Green Stem / Leaf -->
  <path 
    d="M 256 104 C 256 80, 280 64, 304 68 C 304 92, 280 108, 256 104 Z" 
    fill="#22C55E" 
  />
  <circle cx="256" cy="112" r="8" fill="#6D6AFE" />

  <!-- Monospaced Center Element (Geist Mono style) -->
  <text 
    x="256" 
    y="275" 
    font-family="'Geist Mono', 'Inter', monospace" 
    font-size="72" 
    font-weight="700" 
    fill="#F8FAFC" 
    text-anchor="middle"
    letter-spacing="-2"
  >25</text>
</svg>
